services:
  tunnel:
    image: cloudflare/cloudflared:2026.10.0
    command: tunnel --no-autoupdate run
    env_file:
      - .env.tunnel
    restart: unless-stopped
    init: true
    depends_on:
      web:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
